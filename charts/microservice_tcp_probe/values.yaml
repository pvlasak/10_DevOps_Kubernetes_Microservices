appName: servicename
appImage: gcr.io/google-samples/microservices-demo/servicename
appVersion: v0.0.0
appReplicas: 1
containerPort: 8080
containerEnvVars: 
- name: ENV_VAR_ONE
  value: "valueone"
probePeriodSeconds: 2
resourceRequestsCpu:  200m
resourceRequestsMemory: 256Mi
resourceLimitsCpu: 300m
resourceLimitsMemory: 512Mi

servicePort: 8080
serviceType: ClusterIP