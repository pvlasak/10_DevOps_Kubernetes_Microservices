apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
spec:
  replicas: {{ .Values.appReplicas }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - name: {{ .Values.appName }} 
        image: "{{ .Values.appImage }}:{{ .Values.appVersion }}"
        ports: 
        - containerPort: {{ .Values.containerPort }}
        env:
        {{- range .Values.containerEnvVars}}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end}}
        livenessProbe:
          httpGet: 
            path: {{ .Values.probePath }}
            port: {{ .Values.containerPort }}
          periodSeconds: {{ .Values.probePeriodSeconds }}
        readinessProbe:
          httpGet: 
            path: {{ .Values.probePath }}
            port: {{ .Values.containerPort }}
          periodSeconds: {{ .Values.probePeriodSeconds }}
        resources:
          requests: 
            cpu: {{ .Values.resourceRequestsCpu }}
            memory: {{ .Values.resourceRequestsMemory }}
          limits:
            cpu: {{ .Values.resourceLimitsCpu }}
            memory: {{ .Values.resourceLimitsMemory }}