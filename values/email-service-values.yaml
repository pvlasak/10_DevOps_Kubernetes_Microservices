appName: emailservice
appImage: gcr.io/google-samples/microservices-demo/emailservice
appVersion: v0.8.0
appReplicas: 2
containerPort: 8080
containerEnvVars: 
- name: PORT
  value: "8080"
probePeriodSeconds: 5
resourceRequestsCpu:  50m
resourceRequestsMemory: 64Mi
resourceLimitsCpu: 100m
resourceLimitsMemory: 128Mi

servicePort: 5000