appName: currencyservice
appImage: gcr.io/google-samples/microservices-demo/currencyservice
appVersion: v0.8.0
appReplicas: 2
containerPort: 7000
containerEnvVars: 
- name: PORT
  value: "7000"
- name: DISABLE_PROFILER
  value: "1"
probePeriodSeconds: 5
resourceRequestsCpu:  50m
resourceRequestsMemory: 64Mi
resourceLimitsCpu: 140m
resourceLimitsMemory: 128Mi

servicePort: 7000