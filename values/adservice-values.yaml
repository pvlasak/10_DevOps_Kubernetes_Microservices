appName: adservice
appImage: gcr.io/google-samples/microservices-demo/adservice
appVersion: v0.8.0
appReplicas: 2
containerPort: 9555
containerEnvVars: 
- name: PORT
  value: "9555"
probePeriodSeconds: 5
resourceRequestsCpu:  200m
resourceRequestsMemory: 180Mi
resourceLimitsCpu: 300m
resourceLimitsMemory: 300Mi

servicePort: 9555