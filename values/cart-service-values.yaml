appName: cartservice
appImage: gcr.io/google-samples/microservices-demo/cartservice
appVersion: v0.8.0
appReplicas: 2
containerPort: 7070
containerEnvVars: 
- name: PORT
  value: "7070"
- name: REDIS_ADDR
  value: "redis-cart:6379"
probePeriodSeconds: 5
resourceRequestsCpu:  70m
resourceRequestsMemory: 64Mi
resourceLimitsCpu: 200m
resourceLimitsMemory: 128Mi

servicePort: 7070