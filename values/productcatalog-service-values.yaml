appName: productcatalogservice
appImage: gcr.io/google-samples/microservices-demo/productcatalogservice
appVersion: v0.8.0
appReplicas: 2
containerPort: 3550
containerEnvVars: 
- name: PORT
  value: "3550"
- name: DISABLE_PROFILER
  value: "1"
probePeriodSeconds: 5
resourceRequestsCpu:  50m
resourceRequestsMemory: 64Mi
resourceLimitsCpu: 100m
resourceLimitsMemory: 128Mi

servicePort: 3550